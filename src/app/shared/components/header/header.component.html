<header class="header">
  <div class="header-inner">
    
    <div class="logo">
      <a routerLink="/home" class="logo-header">
        <img src="assets/ma-icone-removebg-preview (1).png" alt="Logo do Meu Ateliê" class="logo-image">
        <h1 class="logo-text">Meu Ateliê</h1>
      </a>
    </div>

    <nav class="nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/home" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/pedidos" routerLinkActive="nav-link--active" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Pedidos
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/materiais" routerLinkActive="nav-link--active" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Materiais
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/clientes" routerLinkActive="nav-link--active" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Clientes
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/relatorios" routerLinkActive="nav-link--active" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Relatorios
          </a>
        </li>
      </ul>
    </nav>

    <a (click)="toggleMenu()" class="hamburger" aria-label="Abrir menu" style="cursor: pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </a>

    <div id="mobile-menu" class="mobile-menu" [class.aberto]="isMenuOpen">
      <nav class="mobile-nav">
        <a routerLink="/home" (click)="toggleMenu()" routerLinkActive="mobile-nav-link--active" [routerLinkActiveOptions]="{exact: true}" class="mobile-nav-link">Inicio</a>
        <a routerLink="/pedidos" (click)="toggleMenu()" routerLinkActive="mobile-nav-link--active" class="mobile-nav-link">Pedidos</a>
        <a routerLink="/materiais" (click)="toggleMenu()" routerLinkActive="mobile-nav-link--active" class="mobile-nav-link">Materiais</a>
        <a routerLink="/clientes" (click)="toggleMenu()" routerLinkActive="mobile-nav-link--active" class="mobile-nav-link">Clientes</a>
        <a routerLink="/relatorios" (click)="toggleMenu()" routerLinkActive="mobile-nav-link--active" class="mobile-nav-link">Relatorios</a>
      </nav>
    </div>

  </div>
</header>
