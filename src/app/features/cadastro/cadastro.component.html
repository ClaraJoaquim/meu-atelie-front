<div class="card-principal">

<div class="card-global">

  <div class="logo-section">
    <h1 class="title-logo">Meu Ateliê</h1>
    <p class="subtitle">Crie sua conta e gerencie suas encomendas</p>
    <div class="divider"></div>
  </div>

  <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()">

    <div class="form-group">
      <label for="nome" class="label-global">Nome Completo</label>
      <input type="text" id="nome" class="input-global" placeholder="Ex: Maria da Silva" formControlName="nome">

      <div *ngIf="nome?.invalid && nome?.touched" class="erro">
        Nome é obrigatório
      </div>
    </div>

    <div class="form-group">
      <label for="email-cad" class="label-global">Email</label>
      <input type="email" id="email-cad" class="input-global" placeholder="seu@email.com" formControlName="email">

      <div *ngIf="email?.invalid && email?.touched" class="erro">
        Email inválido
      </div>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="cpf" class="label-global">CPF</label>
        <input type="text" id="cpf" class="input-global" placeholder="000.000.000-00" formControlName="cpf"
          maxlength="14" (input)="formatarCPF($event)">

        <div *ngIf="cpf?.hasError('required') && cpf?.touched" class="erro">
          CPF obrigatório
        </div>
        <div *ngIf="cpf?.hasError('cpfInvalido') && cpf?.touched" class="erro">
          CPF inválido
        </div>
      </div>

      <div class="form-group">
        <label for="telefone" class="label-global">Telefone</label>
        <input type="text" id="telefone" class="input-global" placeholder="(00) 00000-0000" formControlName="telefone"
          maxlength="15" (input)="formatarTelefone($event)">

        <div *ngIf="telefone?.invalid && telefone?.touched" class="erro">
          Telefone obrigatório
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="senha-cad" class="label-global">Senha</label>
        <input type="password" id="senha-cad" class="input-global" placeholder="******" formControlName="senha">
      </div>

      <div class="form-group">
        <label for="confirma-senha" class="label-global">Confirmar</label>
        <input type="password" id="confirma-senha" class="input-global" placeholder="******"
          formControlName="confirmarSenha">
      </div>
    </div>

    <div *ngIf="cadastroForm.hasError('senhaDiferente') && confirmarSenha?.touched"
      style="color: red; font-size: 12px; margin-top: -10px; margin-bottom: 10px;">
      As senhas não coincidem
    </div>

    <div *ngIf="emailJaCadastrado" class="alerta-erro-container">
      <p>⚠️ Este e-mail já possui cadastro!</p>
      <button type="button" (click)="irParaLogin()" class="btn-ir-login">
        Ir para Login
      </button>
    </div>

    <div class="btn-cadastrar-wrapper">
      <button type="submit" class="btn-primary-global" [disabled]="cadastroForm.invalid">
        Cadastrar
      </button>
    </div>
  </form>

  <div class="login-link">
    <span>Já possui uma conta? </span>
    <a href="/login" class="link-text">Fazer Login</a>
  </div>

</div>
</div>

<app-modal></app-modal>
