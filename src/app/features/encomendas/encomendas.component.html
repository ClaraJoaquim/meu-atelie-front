<app-header></app-header>

  <main class="main">
    <div class="container">

      <section class="page-header">
        <div class="page-header-text">
          <a routerLink="/pedidos" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Voltar para Pedidos
          </a>
          <h2 class="page-title">Nova Encomenda</h2>
          <p class="page-subtitle">Preencha os dados abaixo para registrar uma nova encomenda.</p>
        </div>
      </section>

      <form class="form-card" action="#" method="post">

        <!-- Secao: Dados do cliente -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Dados do Cliente
          </legend>

          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="cliente" class="form-label">Cliente *</label>
              <select id="cliente" name="cliente" class="form-select" required>
                <option value="" disabled selected>Selecione um cliente</option>
                <option value="1">Lucia Mendes</option>
                <option value="2">Roberto Alves</option>
                <option value="3">Fernanda Lima</option>
                <option value="4">Ana Silva</option>
                <option value="5">Carlos Souza</option>
                <option value="6">Patricia Oliveira</option>
              </select>
            </div>

            <div class="form-group">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="tel" id="telefone" name="telefone" class="form-input" placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="email@exemplo.com">
            </div>
          </div>
        </fieldset>

        <!-- Secao: Dados da encomenda -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Dados da Encomenda
          </legend>

          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="tipo-bordado" class="form-label">Tipo de Bordado *</label>
              <select id="tipo-bordado" name="tipo-bordado" class="form-select" required>
                <option value="" disabled selected>Selecione o tipo</option>
                <option value="toalha-mesa">Toalha de mesa bordada</option>
                <option value="jogo-cama">Jogo de cama personalizado</option>
                <option value="pano-prato">Pano de prato (kit)</option>
                <option value="camiseta">Camiseta bordada</option>
                <option value="almofada">Almofada decorativa</option>
                <option value="enxoval">Enxoval de bebe</option>
                <option value="toalha-banho">Toalha de banho</option>
                <option value="guardanapos">Guardanapos (kit)</option>
                <option value="quadro">Quadro decorativo bordado</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div class="form-group form-group--full">
              <label for="descricao" class="form-label">Descricao do Bordado *</label>
              <textarea id="descricao" name="descricao" class="form-textarea" rows="4" placeholder="Descreva os detalhes: cores, motivos, tamanho, tecnica desejada..." required></textarea>
            </div>

            <div class="form-group">
              <label for="quantidade" class="form-label">Quantidade *</label>
              <input type="number" id="quantidade" name="quantidade" class="form-input" min="1" value="1" required>
            </div>

            <div class="form-group">
              <label for="tamanho" class="form-label">Tamanho / Dimensoes</label>
              <input type="text" id="tamanho" name="tamanho" class="form-input" placeholder="Ex: 1,50m x 2,20m">
            </div>
          </div>
        </fieldset>

        <!-- Secao: Prazos e valor -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Prazos e Valor
          </legend>

          <div class="form-grid">
            <div class="form-group">
              <label for="data-pedido" class="form-label">Data do Pedido *</label>
              <input type="date" id="data-pedido" name="data-pedido" class="form-input" required>
            </div>

            <div class="form-group">
              <label for="prazo-entrega" class="form-label">Prazo de Entrega *</label>
              <input type="date" id="prazo-entrega" name="prazo-entrega" class="form-input" required>
            </div>

            <div class="form-group">
              <label for="valor" class="form-label">Valor Total (R$) *</label>
              <input type="text" id="valor" name="valor" class="form-input" placeholder="0,00" required>
            </div>

            <div class="form-group">
              <label for="forma-pagamento" class="form-label">Forma de Pagamento</label>
              <select id="forma-pagamento" name="forma-pagamento" class="form-select">
                <option value="" disabled selected>Selecione</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="pix">PIX</option>
                <option value="cartao-credito">Cartao de credito</option>
                <option value="cartao-debito">Cartao de debito</option>
                <option value="transferencia">Transferencia bancaria</option>
                <option value="parcelado">Parcelado</option>
              </select>
            </div>

            <div class="form-group">
              <label for="entrada" class="form-label">Valor de Entrada (R$)</label>
              <input type="text" id="entrada" name="entrada" class="form-input" placeholder="0,00">
            </div>

            <div class="form-group">
              <label for="status" class="form-label">Status Inicial</label>
              <select id="status" name="status" class="form-select">
                <option value="em-andamento" selected>Em andamento</option>
                <option value="aguardando">Aguardando material</option>
                <option value="orcamento">Orcamento</option>
              </select>
            </div>
          </div>
        </fieldset>

        <!-- Secao: Observacoes -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Observacoes
          </legend>

          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="observacoes" class="form-label">Anotacoes Adicionais</label>
              <textarea id="observacoes" name="observacoes" class="form-textarea" rows="3" placeholder="Informacoes extras, preferencias do cliente, detalhes de entrega..."></textarea>
            </div>
          </div>
        </fieldset>

        <!-- Botoes de acao -->
        <div class="form-actions">
          <a href="pedidos.html" class="btn-secondary">Cancelar</a>
          <button type="submit" class="btn-nova-encomenda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Salvar Encomenda
          </button>
        </div>

      </form>

    </div>
  </main>

<app-footer></app-footer>
