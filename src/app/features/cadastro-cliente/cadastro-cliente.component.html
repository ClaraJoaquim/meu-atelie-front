<app-header></app-header>

  <main class="main">
    <div class="container">

      <section class="page-header">
        <div class="page-header-text">
          <a routerLink="/clientes" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Voltar para Clientes
          </a>
          <h2 class="page-title">Novo Cliente</h2>
          <p class="page-subtitle">Cadastre um novo cliente no sistema.</p>
        </div>
      </section>

      <form class="form-card" action="#" method="post">

        <!-- Secao: Dados pessoais -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Dados Pessoais
          </legend>

          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="nome-completo" class="form-label">Nome Completo *</label>
              <input type="text" id="nome-completo" name="nome-completo" class="form-input" placeholder="Ex: Maria Aparecida dos Santos" required>
            </div>

            <div class="form-group">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" id="cpf" name="cpf" class="form-input" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
              <label for="data-nascimento" class="form-label">Data de Nascimento</label>
              <input type="date" id="data-nascimento" name="data-nascimento" class="form-input">
            </div>
          </div>
        </fieldset>

        <!-- Secao: Contato -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Contato
          </legend>

          <div class="form-grid">
            <div class="form-group">
              <label for="telefone" class="form-label">Telefone Principal *</label>
              <input type="tel" id="telefone" name="telefone" class="form-input" placeholder="(00) 00000-0000" required>
            </div>

            <div class="form-group">
              <label for="telefone2" class="form-label">Telefone Secundario</label>
              <input type="tel" id="telefone2" name="telefone2" class="form-input" placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="email@exemplo.com">
            </div>

            <div class="form-group">
              <label for="instagram" class="form-label">Instagram</label>
              <input type="text" id="instagram" name="instagram" class="form-input" placeholder="@usuario">
            </div>
          </div>
        </fieldset>

        <!-- Secao: Endereco -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Endereco
          </legend>

          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="endereco" class="form-label">Rua / Avenida</label>
              <input type="text" id="endereco" name="endereco" class="form-input" placeholder="Ex: Rua das Flores, 123">
            </div>

            <div class="form-group">
              <label for="bairro" class="form-label">Bairro</label>
              <input type="text" id="bairro" name="bairro" class="form-input" placeholder="Ex: Centro">
            </div>

            <div class="form-group">
              <label for="cidade" class="form-label">Cidade</label>
              <input type="text" id="cidade" name="cidade" class="form-input" placeholder="Ex: Sao Paulo">
            </div>

            <div class="form-group">
              <label for="estado" class="form-label">Estado</label>
              <select id="estado" name="estado" class="form-select">
                <option value="" disabled selected>Selecione</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapa</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceara</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espirito Santo</option>
                <option value="GO">Goias</option>
                <option value="MA">Maranhao</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Para</option>
                <option value="PB">Paraiba</option>
                <option value="PR">Parana</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piaui</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondonia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">Sao Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cep" class="form-label">CEP</label>
              <input type="text" id="cep" name="cep" class="form-input" placeholder="00000-000">
            </div>
          </div>
        </fieldset>

        <!-- Secao: Preferencias -->
        <fieldset class="form-section">
          <legend class="form-legend">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Preferencias e Anotacoes
          </legend>

          <div class="form-grid">
            <div class="form-group">
              <label for="como-conheceu" class="form-label">Como conheceu o atelie?</label>
              <select id="como-conheceu" name="como-conheceu" class="form-select">
                <option value="" disabled selected>Selecione</option>
                <option value="indicacao">Indicacao de amigo/familiar</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
                <option value="google">Busca no Google</option>
                <option value="feira">Feira/Evento</option>
                <option value="vizinhanca">Vizinhanca</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="tipo-preferido" class="form-label">Tipo de bordado preferido</label>
              <select id="tipo-preferido" name="tipo-preferido" class="form-select">
                <option value="" disabled selected>Selecione</option>
                <option value="ponto-cruz">Ponto Cruz</option>
                <option value="bordado-livre">Bordado Livre</option>
                <option value="richelieu">Richelieu</option>
                <option value="hardanger">Hardanger</option>
                <option value="vagonite">Vagonite</option>
                <option value="crivo">Crivo</option>
                <option value="matbordado">Matbordado</option>
                <option value="todos">Varios tipos</option>
              </select>
            </div>

            <div class="form-group form-group--full">
              <label for="observacoes" class="form-label">Anotacoes sobre o cliente</label>
              <textarea id="observacoes" name="observacoes" class="form-textarea" rows="3" placeholder="Preferencias, datas importantes, observacoes gerais sobre o cliente..."></textarea>
            </div>
          </div>
        </fieldset>

        <!-- Botoes de acao -->
        <div class="form-actions">
          <a href="clientes.html" class="btn-secondary">Cancelar</a>
          <button type="submit" class="btn-nova-encomenda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Salvar Cliente
          </button>
        </div>

      </form>

    </div>
  </main>

<app-footer></app-footer>
